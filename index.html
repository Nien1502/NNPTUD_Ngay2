<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Sản phẩm</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { margin: 40px; }
    img { max-width: 100px; }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="card shadow-lg border-0">
          <div class="card-header bg-primary text-white text-center">
            <h2 class="mb-0">Quản lý Sản phẩm</h2>
          </div>
          <div class="card-body">
            <div class="row mb-3 align-items-end">
              <div class="col-md-5 mb-2">
                <label for="searchInput" class="form-label fw-bold">Tìm kiếm theo tên</label>
                <input type="text" id="searchInput" class="form-control" placeholder="Nhập tên sản phẩm..." oninput="onSearchChanged()">
              </div>
              <div class="col-md-7 mb-2 text-md-end">
                <label class="form-label fw-bold me-2">Sắp xếp:</label>
                <button class="btn btn-outline-primary me-2 mb-1" onclick="sortByPrice('asc')">Giá tăng</button>
                <button class="btn btn-outline-primary me-2 mb-1" onclick="sortByPrice('desc')">Giá giảm</button>
                <button class="btn btn-outline-success me-2 mb-1" onclick="sortByName('asc')">Tên A-Z</button>
                <button class="btn btn-outline-success mb-1" onclick="sortByName('desc')">Tên Z-A</button>
              </div>
            </div>
            <div id="data-container" class="table-responsive">Đang tải dữ liệu...</div>
            <!-- Modal chỉnh sửa -->
            <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
              <div class="modal-dialog">
                <div class="modal-content">
                  <div class="modal-header">
                    <h5 class="modal-title" id="editModalLabel">Chỉnh sửa sản phẩm</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                  </div>
                  <div class="modal-body">
                    <form id="editForm">
                      <input type="hidden" id="editId">
                      <div class="mb-3">
                        <label class="form-label">Tên sản phẩm</label>
                        <input type="text" class="form-control" id="editTitle" required>
                      </div>
                      <div class="mb-3">
                        <label class="form-label">Giá</label>
                        <input type="number" class="form-control" id="editPrice" required>
                      </div>
                      <div class="mb-3">
                        <label class="form-label">Mô tả</label>
                        <textarea class="form-control" id="editDescription" rows="2" required></textarea>
                      </div>
                      <div class="mb-3">
                        <label class="form-label">Danh mục</label>
                        <input type="text" class="form-control" id="editCategory">
                      </div>
                      <div class="mb-3">
                        <label class="form-label">Hình ảnh (URL)</label>
                        <input type="text" class="form-control" id="editImage">
                      </div>
                      <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
