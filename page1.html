<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Posts & Comments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="crud_api_jsonserver.js"></script>
</head>

<body>
    <div class="container py-4">
        <h2 class="mb-4 text-primary">Quản lý Posts & Comments</h2>
        <div class="mb-3 row">
            <div class="col-md-6">
                <input id="searchInput" class="form-control" placeholder="Tìm kiếm tiêu đề..." oninput="onChanged()">
            </div>
            <div class="col-md-6 text-end">
                <button class="btn btn-outline-secondary me-1" onclick="sortBy('nameAsc')">Sắp xếp A-Z</button>
                <button class="btn btn-outline-secondary me-1" onclick="sortBy('nameDesc')">Sắp xếp Z-A</button>
                <button class="btn btn-outline-secondary" onclick="sortBy('priceDesc')">Sắp xếp Views</button>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-bordered align-middle">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th></th>
                        <th>Tiêu đề</th>
                        <th></th>
                        <th></th>
                        <th>Chi tiết & Bình luận</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="products-container"></tbody>
            </table>
        </div>
        <div class="alert alert-info mt-4">
            <b>Hướng dẫn:</b> Nhấn <b>Thêm Post</b> để tạo mới. Nhấn <b>Xoá mềm</b> để ẩn post, <b>Khôi phục</b> để hiện lại. Xoá cứng sẽ xoá vĩnh viễn.<br>
            Bình luận có thể thêm/xoá/sửa trực tiếp trong từng post.
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
